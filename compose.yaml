# 本番 (EC2) とローカル確認の両方で使う。差分は .env で切り替える（.env.example 参照）。
# 本番サーバーにはこのファイルと .env だけを置く（デプロイ時に GitHub Actions が配置する）。
# web と scheduler で共通の環境変数
x-app-env: &app-env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
  DB_HOST: db
  DB_PASSWORD: ${DB_PASSWORD}
  BACKUP_BUCKET: ${BACKUP_BUCKET:-}
  AWS_REGION: ap-northeast-1

services:
  db:
    image: mysql:8.4.10
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Tokyo
    # t4g.micro (メモリ 1GB) で Rails と同居させるための省メモリ設定
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --max-connections=30
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    image: ${WEB_IMAGE:-babelheim-web:local}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      FORCE_SSL: ${FORCE_SSL:-true}
      # 設定すると Thruster が Let's Encrypt で証明書を取得し 443 で待ち受ける
      TLS_DOMAIN: ${TLS_DOMAIN:-}
      WEB_CONCURRENCY: 1
      RAILS_MAX_THREADS: 3
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - storage:/rails/storage

  scheduler:
    image: ${WEB_IMAGE:-babelheim-web:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["supercronic", "-passthrough-logs", "config/crontab"]
    environment:
      <<: *app-env

volumes:
  db-data:
  storage:
