# 本番 (EC2) とローカル確認の両方で使う。差分は .env で切り替える（.env.example 参照）。
services:
  db:
    image: mysql:8.4.10
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Tokyo
    volumes:
      - db-data:/var/lib/mysql
      - ./config/mysql/babelheim.cnf:/etc/mysql/conf.d/babelheim.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    image: ${WEB_IMAGE:-babelheim-web:local}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?RAILS_MASTER_KEY is required}
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      FORCE_SSL: ${FORCE_SSL:-true}
      # 設定すると Thruster が Let's Encrypt で証明書を取得し 443 で待ち受ける
      TLS_DOMAIN: ${TLS_DOMAIN:-}
      WEB_CONCURRENCY: 1
      RAILS_MAX_THREADS: 3
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - storage:/rails/storage

volumes:
  db-data:
  storage:
